<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sorare Stats Dashboard</title>
<style>
:root{
  --bg:#0f172a; --surface:#1e293b; --surface-2:#0b1222; --border:#334155; --border-soft:#1f2a3d;
  --text:#e2e8f0; --text-strong:#f8fafc; --muted:#94a3b8; --faint:#64748b;
  --accent:#6366f1; --accent-text:#a5b4fc; --accent-strong:#818cf8;
  --high:#4ade80; --mid:#facc15; --low:#f87171;
  --gk-bg:#164e63; --gk-fg:#67e8f9; --df-bg:#14532d; --df-fg:#86efac;
  --md-bg:#312e81; --md-fg:#a5b4fc; --fw-bg:#7f1d1d; --fw-fg:#fca5a5;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f5f7fb; --surface:#ffffff; --surface-2:#f1f4f9; --border:#d5dbe5; --border-soft:#e7ebf2;
    --text:#1e293b; --text-strong:#0f172a; --muted:#526075; --faint:#7a869a;
    --accent:#4f46e5; --accent-text:#4338ca; --accent-strong:#4f46e5;
    --high:#15803d; --mid:#a16207; --low:#b91c1c;
    --gk-bg:#cffafe; --gk-fg:#155e75; --df-bg:#dcfce7; --df-fg:#166534;
    --md-bg:#e0e7ff; --md-fg:#3730a3; --fw-bg:#fee2e2; --fw-fg:#991b1b;
    --shadow:0 10px 30px rgba(15,23,42,.12);
    color-scheme:light;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px 0;position:sticky;top:0;z-index:40}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:1.2rem;font-weight:700;color:var(--text-strong)}
.meta-line{font-size:.75rem;color:var(--faint)}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--faint)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent-strong);border-bottom-color:var(--accent-strong)}
main{padding:16px 24px 40px;max-width:1600px;margin:0 auto}
.tab-content{display:none}.tab-content.active{display:block}

/* Filters */
.filters-toggle{display:none}
.filters{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.f>.flabel{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.seg button{background:var(--surface-2);border:0;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:.8rem}
.seg button+button{border-left:1px solid var(--border)}
.seg button.active{background:var(--accent);color:#fff}
.slider{display:flex;align-items:center;gap:10px;height:32px}
.slider input[type=range]{width:150px;accent-color:var(--accent)}
.slider span{min-width:62px;font-size:.82rem}
select.sel{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 8px;height:32px;cursor:pointer}

/* Multi-select */
.multi{position:relative}
.multi-trigger{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 28px 6px 10px;height:32px;min-width:150px;max-width:230px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;width:100%}
.multi-trigger::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.multi-trigger.has-sel{border-color:var(--accent);color:var(--accent-text)}
.multi-pop{display:none;position:absolute;top:calc(100% + 4px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;z-index:60;min-width:240px;max-width:320px;box-shadow:var(--shadow)}
.multi.open .multi-pop{display:block}
.multi-search{padding:8px;border-bottom:1px solid var(--border)}
.multi-search input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:6px 8px;outline:none}
.multi-search input:focus{border-color:var(--accent)}
.multi-list{max-height:300px;overflow-y:auto;padding:4px 0}
.opt{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:.83rem;color:var(--text)}
.opt:hover{background:var(--surface-2)}
.opt input{accent-color:var(--accent);cursor:pointer}
.opt.all{border-bottom:1px solid var(--border);color:var(--muted);font-weight:600}
.opt.group{border-top:1px solid var(--border);color:var(--muted);font-weight:700;margin-top:2px}
.opt.sub{padding-left:28px}
.opt .count{margin-left:auto;color:var(--faint);font-size:.72rem}

/* Chips & summary */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;min-height:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 6px 3px 10px;font-size:.78rem}
.chip b{font-weight:600;color:var(--muted)}
.chip button{background:none;border:0;cursor:pointer;color:var(--faint);font-size:.9rem;line-height:1;padding:0 3px}
.chip button:hover{color:var(--text)}
.chip.reset{background:none;border-style:dashed;cursor:pointer;padding:3px 10px;color:var(--muted)}
.summary{margin:12px 0 0;font-size:.85rem;color:var(--muted)}
.summary strong{color:var(--text)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-top:16px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-head h2{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.card-head h2 span{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);margin-left:6px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:.8rem;color:var(--muted);height:32px}
.btn:hover{border-color:var(--accent);color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.collapse-btn{background:none;border:0;cursor:pointer;color:var(--faint);font-size:.8rem}

/* Tables */
.table-scroll{overflow:auto}
.table-scroll.players-scroll{max-height:75vh}
.table-scroll.agg-scroll{max-height:440px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.82rem}
th,td{padding:7px 10px;white-space:nowrap;border-bottom:1px solid var(--border-soft)}
th{background:var(--surface);color:var(--muted);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;text-align:left;position:sticky;top:0;z-index:2}
td.r,th.r{text-align:right}
.players th{cursor:pointer;user-select:none}
.players th:hover{color:var(--accent-text)}
.players th .arr{margin-left:3px;opacity:.35}
.players th.sorted{color:var(--accent-text)}
.players th.sorted .arr{opacity:1}
.players th:first-child,.players td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);border-right:1px solid var(--border)}
.players th:first-child{z-index:3}
.players tbody tr:hover td{background:var(--surface-2)}
.players tbody tr:hover td:first-child{background:var(--surface-2)}
.players td.name a{color:var(--text-strong);text-decoration:none;font-weight:600;cursor:pointer}
.players td.name a:hover{color:var(--accent-text)}
.agg td.cat{background:var(--surface-2);color:var(--muted);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:6px 10px}
.agg td.lbl{color:var(--text)}
.agg td.lbl small{color:var(--faint);margin-left:6px}
.agg th.hl,.agg td.hl{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.68rem;font-weight:700}
.pos-Goalkeeper{background:var(--gk-bg);color:var(--gk-fg)}
.pos-Defender{background:var(--df-bg);color:var(--df-fg)}
.pos-Midfielder{background:var(--md-bg);color:var(--md-fg)}
.pos-Forward{background:var(--fw-bg);color:var(--fw-fg)}
.score{font-weight:700}
.high{color:var(--high)}.mid{color:var(--mid)}.low{color:var(--low)}
.dim{color:var(--faint)}
.heat-1{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.heat-2{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.heat-3{background:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--text-strong);font-weight:600}
.empty{padding:48px 16px;text-align:center;color:var(--faint)}
#pagination{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px}
#pagination .info{font-size:.8rem;color:var(--faint)}
.btn[disabled]{opacity:.35;cursor:default;border-color:var(--border);color:var(--muted)}

/* Méthode */
details.method{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:.84rem;color:var(--muted)}
details.method summary{cursor:pointer;font-weight:600;color:var(--text)}
details.method ul{margin:10px 0 0 18px;display:flex;flex-direction:column;gap:6px}

/* Vue joueur */
.search-row{display:flex;gap:10px;flex-wrap:wrap}
#player-search{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;width:min(420px,100%);outline:none}
#player-search:focus{border-color:var(--accent)}
.results{margin-top:10px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.results:empty{display:none}
.result{display:flex;align-items:center;gap:10px;padding:8px 14px;border:0;border-bottom:1px solid var(--border-soft);background:none;text-align:left;cursor:pointer;width:100%}
.result:last-child{border-bottom:0}
.result:hover{background:var(--surface-2)}
.result .rn{font-weight:600;color:var(--text-strong)}
.result .rm{color:var(--faint);font-size:.8rem}
.pcard{padding:16px}
.pcard-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.pcard h2{font-size:1.15rem;color:var(--text-strong)}
.pcard .pmeta{font-size:.82rem;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pcontrols{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:var(--surface-2);border-radius:8px;padding:8px 14px;min-width:110px}
.kpi .k{font-size:.66rem;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:1.2rem;font-weight:700;margin-top:2px}
.pgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.pgroup h3{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.prow{display:grid;grid-template-columns:1fr 56px 90px 34px;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border-soft);font-size:.82rem}
.prow .pv{text-align:right;font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.prow .pp{text-align:right;color:var(--faint);font-size:.74rem}
.note{font-size:.76rem;color:var(--faint);margin-top:10px}
.compare td.best{color:var(--accent-text);font-weight:700}

@media (max-width:760px){
  .top{padding:12px 16px 0;position:static}
  main{padding:12px 16px 32px}
  .filters-toggle{display:inline-flex;margin-bottom:10px}
  .filters{display:none;flex-direction:column;align-items:stretch}
  .filters.open{display:flex}
  .multi-trigger{max-width:none}
  .multi-pop{min-width:100%;max-width:none}
  .slider input[type=range]{flex:1}
  .table-scroll.players-scroll{max-height:none}
  .table-scroll.agg-scroll{max-height:60vh}
  .agg td.lbl,.agg th:first-child{position:sticky;left:0;z-index:1;background:var(--surface);white-space:normal;min-width:128px;max-width:150px;border-right:1px solid var(--border)}
  .agg th:first-child{z-index:3}
  .agg td.lbl small{display:block;margin-left:0}
  .agg td.cat{position:sticky;left:0}
  .pgroups{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <h1>Sorare Stats Dashboard</h1>
    <span class="meta-line" id="meta-line">Chargement des données…</span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="group">Vue groupe</button>
    <button class="tab" data-tab="player">Vue joueur</button>
  </nav>
</header>

<main>
<section id="tab-group" class="tab-content active">
  <button class="btn filters-toggle" id="filters-toggle">Filtres</button>
  <div class="filters" id="filters">
    <div class="f"><span class="flabel">Range</span>
      <div class="seg" id="range-seg"></div>
    </div>
    <div class="f"><span class="flabel">Poste</span><div class="multi" id="m-pos"></div></div>
    <div class="f"><span class="flabel">Championnat</span><div class="multi" id="m-comp"></div></div>
    <div class="f"><span class="flabel">Club</span><div class="multi" id="m-club"></div></div>
    <div class="f"><span class="flabel">Équipe nationale</span><div class="multi" id="m-nat"></div></div>
    <div class="f"><label for="mins">Min. jouées / match</label>
      <div class="slider"><input type="range" id="mins" min="0" max="90" step="5"/><span id="mins-val" class="num"></span></div>
    </div>
    <div class="f"><label for="min-games">Matchs joués</label>
      <select id="min-games" class="sel"></select>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <p class="summary" id="summary"></p>

  <section class="card">
    <div class="card-head">
      <h2>Agrégats du groupe</h2>
      <div class="actions"><button class="btn" id="agg-csv">Export CSV</button></div>
    </div>
    <div class="table-scroll agg-scroll"><table class="agg" id="agg-table"></table></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>Joueurs <span id="rows-count"></span></h2>
      <div class="actions"><div class="multi" id="m-cols"></div><button class="btn" id="rows-csv">Export CSV</button></div>
    </div>
    <div class="table-scroll players-scroll"><table class="players" id="players-table"><thead></thead><tbody></tbody></table></div>
    <div id="players-empty" class="empty" hidden>Aucun joueur ne correspond à ces filtres.</div>
    <div id="pagination"></div>
  </section>

  <details class="method">
    <summary>Méthode et limites</summary>
    <ul id="method-list"></ul>
  </details>
</section>

<section id="tab-player" class="tab-content">
  <div class="search-row">
    <input id="player-search" type="search" placeholder="Rechercher un joueur par nom…" autocomplete="off"/>
  </div>
  <div class="results" id="search-results"></div>
  <div id="player-card"></div>
  <section class="card" id="compare-card" hidden>
    <div class="card-head">
      <h2>Comparaison</h2>
      <div class="actions">
        <select class="sel" id="cmp-scope"></select>
        <div class="seg" id="cmp-range"></div>
        <button class="btn" id="cmp-clear">Vider</button>
      </div>
    </div>
    <div class="table-scroll"><table class="agg compare" id="cmp-table"></table></div>
  </section>
</section>
</main>

<script>
'use strict';
// ── Constantes ────────────────────────────────────────────
const POS = ['Goalkeeper','Defender','Midfielder','Forward'];
const POS_LABELS = {Goalkeeper:'Gardien',Defender:'Défenseur',Midfielder:'Milieu',Forward:'Attaquant'};
const CAT_LABELS = {general:'Général',defending:'Défense',possession:'Possession',passing:'Passes',
  attacking:'Attaque',goalkeeping:'Gardien',decisive_pos:'Décisif +',decisive_neg:'Décisif −'};
const ALL = 'all', INTL = 'intl', NO_NAT = '__none__';
const DEFAULT_MINS = 30, DEFAULT_GAMES = 3, PAGE_SIZE = 100;
const DEFAULT_COLS = ['accurate_pass','successful_final_third_passes','duel_won','won_tackle',
  'interception_won','ontarget_scoring_att','goals','goal_assist'];
const GK_COLS = ['saves','saved_ibox','good_high_claim','goals_conceded','clean_sheet_60',
  'accurate_pass','accurate_long_balls','error_lead_to_goal'];

// ── Utilitaires ───────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const fmt = v => (v === null || v === undefined) ? '—' : (Math.round(v*100)/100).toLocaleString('fr-FR');
const scoreClass = v => v == null ? '' : v >= 60 ? 'high' : v >= 40 ? 'mid' : 'low';
function flag(code){
  if (!code) return '';
  if (code.length === 2) return String.fromCodePoint(...[...code.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
  const sub = {'gb-eng':'eng','gb-sct':'sct','gb-wls':'wls'}[code];
  if (sub) return String.fromCodePoint(0x1F3F4, ...[...('gb'+sub)].map(c => 0xE0000 + c.charCodeAt(0)), 0xE007F);
  return '';
}
function lowerBound(arr, v){ let lo=0, hi=arr.length; while(lo<hi){ const m=(lo+hi)>>1; if(arr[m]<v) lo=m+1; else hi=m; } return lo; }
function upperBound(arr, v){ let lo=0, hi=arr.length; while(lo<hi){ const m=(lo+hi)>>1; if(arr[m]<=v) lo=m+1; else hi=m; } return lo; }
function pctRank(sortedAsc, v){
  if (v == null || !sortedAsc.length) return null;
  const lo = lowerBound(sortedAsc, v), hi = upperBound(sortedAsc, v);
  return (lo + (hi - lo) / 2) / sortedAsc.length;
}
function downloadCSV(name, rows){
  const csv = rows.map(r => r.map(c => {
    const s = c == null ? '' : typeof c === 'number' ? String(c).replace('.', ',') : String(c);
    return /[";\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8'}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ── Données ───────────────────────────────────────────────
let D, RANGES, STATS, STAT_IDX, PLAYERS, ROWS, ROWS_BY_SCOPE, COMP_NAME, COMP_GROUP;

function prepare(raw){
  D = raw;
  RANGES = raw.ranges;
  STATS = raw.stats.map(([key,label,cat,per]) => ({key,label,cat,per}));
  STAT_IDX = Object.fromEntries(STATS.map((s,i) => [s.key, i]));
  PLAYERS = raw.players.map(([slug,name,club,age,pos,nat,natCode], i) =>
    ({i, slug, name, club, age, pos, nat, natCode, search: norm(name), rows: []}));
  COMP_NAME = {[ALL]:'Tous les matchs', [INTL]:'Matchs internationaux'};
  COMP_GROUP = {};
  raw.comps.forEach(([slug,name,group]) => { COMP_NAME[slug] = name; COMP_GROUP[slug] = group; });
  ROWS = []; ROWS_BY_SCOPE = new Map();
  for (const [pi, scope, ...blocks] of raw.rows){
    const b = {}; let prev = null;
    raw.ranges.forEach((n, k) => { const bl = blocks[k] === 0 ? prev : blocks[k]; b[n] = bl; prev = bl; });
    const row = {p: PLAYERS[pi], scope, b};
    ROWS.push(row); PLAYERS[pi].rows.push(row);
    if (!ROWS_BY_SCOPE.has(scope)) ROWS_BY_SCOPE.set(scope, []);
    ROWS_BY_SCOPE.get(scope).push(row);
  }
}
// Valeur d'une colonne pour une ligne et une range. Bloc = [n, score, stat1, ...]
function val(row, key, range){
  const b = row.b[range];
  if (!b) return null;
  if (key === 'n') return b[0];
  if (key === 'score') return b[1];
  const i = STAT_IDX[key];
  return i === undefined ? null : b[2 + i];
}

// ── État (synchronisé avec l'URL) ─────────────────────────
const S = {
  tab:'group', range:10, pos:new Set(), comp:new Set(), club:new Set(), nat:new Set(),
  minMins:DEFAULT_MINS, minGames:DEFAULT_GAMES, cols:new Set(), sort:{col:'score10', dir:-1}, page:1,
  player:null, cmp:[], cmpScope:ALL, cmpRange:10, pScope:ALL, pRange:10,
};
function readHash(){
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('tab')) S.tab = q.get('tab') === 'player' ? 'player' : 'group';
  if (RANGES.includes(+q.get('r'))) S.range = +q.get('r');
  for (const k of ['pos','comp','club','nat','cols']) S[k] = new Set(q.getAll(k));
  if (q.has('min')) S.minMins = Math.max(0, Math.min(90, +q.get('min') || 0));
  if (q.has('g')) S.minGames = Math.max(1, +q.get('g') || 1);
  if (q.get('sort')){ const [c,d] = q.get('sort').split(':'); S.sort = {col:c, dir: d === '1' ? 1 : -1}; }
  if (q.get('p')) S.player = q.get('p');
  S.cmp = q.getAll('cmp').slice(0,4);
}
function writeHash(){
  const q = new URLSearchParams();
  if (S.tab !== 'group') q.set('tab', S.tab);
  if (S.range !== 10) q.set('r', S.range);
  for (const k of ['pos','comp','club','nat','cols']) S[k].forEach(v => q.append(k, v));
  if (S.minMins !== DEFAULT_MINS) q.set('min', S.minMins);
  if (S.minGames !== DEFAULT_GAMES) q.set('g', S.minGames);
  if (S.sort.col !== 'score10' || S.sort.dir !== -1) q.set('sort', S.sort.col + ':' + S.sort.dir);
  if (S.player) q.set('p', S.player);
  S.cmp.forEach(v => q.append('cmp', v));
  const h = q.toString();
  history.replaceState(null, '', h ? '#' + h : location.pathname + location.search);
}

// ── Composant multi-sélection ─────────────────────────────
// items : [{value,label,cls?,count?}] ou [{group:true,label,values:[...]}]
function Multi(el, {state, allLabel='Tous', search=false, placeholder='Rechercher…', labelOf, onChange}){
  el.innerHTML = `<button type="button" class="multi-trigger"></button>
    <div class="multi-pop">${search ? `<div class="multi-search"><input type="text" placeholder="${esc(placeholder)}" autocomplete="off"/></div>` : ''}
    <div class="multi-list"></div></div>`;
  const trigger = el.querySelector('.multi-trigger'), list = el.querySelector('.multi-list');
  const input = el.querySelector('.multi-search input');
  let items = [];
  const api = {
    setItems(next){ items = next; renderList(); },
    refresh(){ syncChecks(); syncTrigger(); },
  };
  function renderList(){
    const q = input ? norm(input.value) : '';
    let html = q ? '' : `<label class="opt all"><input type="checkbox" data-all/> ${esc(allLabel)}</label>`;
    for (const it of items){
      if (it.group){
        if (q) continue;
        html += `<label class="opt group"><input type="checkbox" data-group="${esc(it.values.join('\u0001'))}"/> ${esc(it.label)}</label>`;
      } else {
        if (q && !norm(it.label).includes(q)) continue;
        html += `<label class="opt ${it.cls||''}"><input type="checkbox" data-v="${esc(it.value)}"/> ${esc(it.label)}${it.count != null ? `<span class="count">${it.count}</span>` : ''}</label>`;
      }
    }
    list.innerHTML = html || '<div class="opt dim">Aucun résultat</div>';
    syncChecks(); syncTrigger();
  }
  function syncChecks(){
    list.querySelectorAll('input').forEach(cb => {
      if (cb.hasAttribute('data-all')) cb.checked = state.size === 0;
      else if (cb.dataset.group){
        const vs = cb.dataset.group.split('\u0001');
        const n = vs.filter(v => state.has(v)).length;
        cb.checked = n === vs.length; cb.indeterminate = n > 0 && n < vs.length;
      } else cb.checked = state.has(cb.dataset.v);
    });
  }
  function syncTrigger(){
    if (state.size === 0){ trigger.textContent = allLabel; trigger.classList.remove('has-sel'); return; }
    const labels = [...state].map(labelOf);
    trigger.textContent = labels.length <= 2 ? labels.join(', ') : labels.length + ' sélectionnés';
    trigger.classList.add('has-sel');
  }
  list.addEventListener('change', e => {
    const cb = e.target;
    if (cb.hasAttribute('data-all')){ state.clear(); }
    else if (cb.dataset.group){ const vs = cb.dataset.group.split('\u0001'); vs.forEach(v => cb.checked ? state.add(v) : state.delete(v)); }
    else { cb.checked ? state.add(cb.dataset.v) : state.delete(cb.dataset.v); }
    syncChecks(); syncTrigger(); onChange();
  });
  trigger.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.multi.open').forEach(m => { if (m !== el) m.classList.remove('open'); });
    el.classList.toggle('open');
    if (el.classList.contains('open') && input) input.focus();
  });
  if (input) input.addEventListener('input', renderList);
  el.addEventListener('click', e => e.stopPropagation());
  return api;
}
document.addEventListener('click', () => document.querySelectorAll('.multi.open').forEach(m => m.classList.remove('open')));
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.multi.open').forEach(m => m.classList.remove('open')); });

function scopeRows(){ return scopes().flatMap(s => ROWS_BY_SCOPE.get(s) || []); }

function filteredRows(){
  const R = S.range, mi = STAT_IDX.mins_played;
  return scopeRows().filter(r => {
    const b = r.b[R];
    if (!b) return false;
    if (S.pos.size && !S.pos.has(r.p.pos)) return false;
    if (S.club.size && !S.club.has(r.p.club)) return false;
    if (S.nat.size && !S.nat.has(r.p.nat || NO_NAT)) return false;
    if (b[0] < S.minGames) return false;
    if (S.minMins > 0 && (b[2 + mi] || 0) < S.minMins) return false;
    return true;
  });
}

// ── Agrégats ──────────────────────────────────────────────
function aggregate(values){
  const v = values.filter(x => x != null).sort((a,b) => b - a);
  const n = v.length;
  if (!n) return null;
  const mean = arr => arr.reduce((a,b) => a + b, 0) / arr.length;
  const k10 = Math.max(1, Math.round(n * 0.10)), k20 = Math.max(1, Math.round(n * 0.20));
  const m = Math.floor(n / 2);
  return {n, mean:mean(v), median: n % 2 ? v[m] : (v[m-1] + v[m]) / 2,
    thr20:v[k20-1], top20:mean(v.slice(0,k20)), thr10:v[k10-1], top10:mean(v.slice(0,k10))};
}
const AGG_COLS = [['mean','Moyenne'],['median','Médiane'],['thr20','Seuil top 20 %'],['top20','Moy. top 20 %'],['thr10','Seuil top 10 %'],['top10','Moy. top 10 %']];
let lastAgg = [];

function renderAgg(rows){
  const R = S.range, out = [];
  out.push({cat:null, key:'score', label:`Score L${R}`, unit:'', a:aggregate(rows.map(r => val(r,'score',R)))});
  for (const cat of Object.keys(CAT_LABELS)){
    for (const s of STATS.filter(x => x.cat === cat)){
      const a = aggregate(rows.map(r => val(r, s.key, R)));
      if (a) out.push({cat, key:s.key, label:s.label, unit: s.per === 'match' ? '/ match' : '/ 90 min', a});
    }
  }
  lastAgg = out;
  let html = '<thead><tr><th>Stat</th><th class="r">n</th>' + AGG_COLS.map(([k,l]) => `<th class="r${k==='thr10'||k==='top10'?' hl':''}">${l}</th>`).join('') + '</tr></thead><tbody>';
  let cat;
  for (const r of out){
    if (!r.a) continue;
    if (r.cat && r.cat !== cat){ cat = r.cat; html += `<tr><td class="cat" colspan="${AGG_COLS.length + 2}">${CAT_LABELS[cat]}</td></tr>`; }
    const cls = k => r.key === 'score' ? 'score ' + scoreClass(r.a[k]) : '';
    html += `<tr><td class="lbl">${esc(r.label)}${r.unit ? `<small>${r.unit}</small>` : ''}</td><td class="r num dim">${r.a.n}</td>`
      + AGG_COLS.map(([k]) => `<td class="r num ${k==='thr10'||k==='top10'?'hl':''}"><span class="${cls(k)}">${fmt(r.a[k])}</span></td>`).join('') + '</tr>';
  }
  if (!out.some(r => r.a)) html += `<tr><td class="empty" colspan="${AGG_COLS.length + 2}">Aucune donnée</td></tr>`;
  $('agg-table').innerHTML = html + '</tbody>';
}

// ── Tableau des joueurs ───────────────────────────────────
function statCols(){
  if (S.cols.size) return STATS.filter(s => S.cols.has(s.key)).map(s => s.key);
  const gkOnly = S.pos.size === 1 && S.pos.has('Goalkeeper');
  return gkOnly ? GK_COLS : DEFAULT_COLS;
}
function baseCols(){
  return [
    {k:'name', l:'Joueur'}, {k:'club', l:'Club'}, {k:'nat', l:'Sélection'}, {k:'pos', l:'Poste'},
    {k:'scope', l:'Compétition'}, {k:'age', l:'Âge', r:true}, {k:'n', l:'Matchs', r:true},
    {k:'mins_played', l:'Min. / match', r:true}, {k:'score10', l:'Score L10', r:true},
  ];
}
function sortVal(r, col){
  switch (col){
    case 'name': return r.p.name; case 'club': return r.p.club; case 'nat': return r.p.nat;
    case 'pos': return POS.indexOf(r.p.pos); case 'scope': return COMP_NAME[r.scope] || r.scope;
    case 'age': return r.p.age; case 'score10': return val(r, 'score', 10);
    default: return val(r, col, S.range);
  }
}
let currentRows = [];

function renderTable(){
  const rows = currentRows;
  const {col, dir} = S.sort;
  const sorted = rows.map(r => [sortVal(r, col), r]).sort((x, y) => {
    const a = x[0], b = y[0];
    if (a == null && b == null) return 0;
    if (a == null) return 1;
    if (b == null) return -1;
    const c = typeof a === 'string' ? a.localeCompare(b, 'fr') : a - b;
    return dir === -1 ? -c : c;
  }).map(x => x[1]);

  const sc = statCols();
  const cols = [...baseCols(), ...sc.map(k => ({k, l:STATS[STAT_IDX[k]].label, r:true, heat:true}))];
  // Percentiles dans le groupe filtré, pour colorer les cellules
  const dist = {};
  for (const k of [...sc, 'score10']){
    dist[k] = rows.map(r => sortVal(r, k)).filter(v => v != null).sort((a,b) => a - b);
  }
  const heat = (k, v) => { const p = pctRank(dist[k], v); return p == null ? '' : p >= .9 ? 'heat-3' : p >= .75 ? 'heat-2' : p >= .5 ? 'heat-1' : ''; };

  const thead = $('players-table').tHead;
  thead.innerHTML = '<tr>' + cols.map(c => {
    const on = c.k === col;
    return `<th data-col="${c.k}" class="${c.r?'r':''} ${on?'sorted':''}">${esc(c.l)}<span class="arr">${on ? (dir === -1 ? '↓' : '↑') : '↕'}</span></th>`;
  }).join('') + '</tr>';
  thead.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    const c = th.dataset.col;
    if (S.sort.col === c) S.sort.dir *= -1;
    else S.sort = {col:c, dir: ['name','club','nat','pos','scope'].includes(c) ? 1 : -1};
    renderTable(); writeHash();
  }));

  const total = sorted.length, pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  S.page = Math.min(Math.max(1, S.page), pages);
  const start = (S.page - 1) * PAGE_SIZE;
  const R = S.range;
  $('players-table').tBodies[0].innerHTML = sorted.slice(start, start + PAGE_SIZE).map(r => {
    const p = r.p, s10 = val(r, 'score', 10);
    return `<tr>
      <td class="name"><a data-slug="${esc(p.slug)}" data-scope="${esc(r.scope)}">${esc(p.name)}</a></td>
      <td>${esc(p.club)}</td>
      <td>${p.nat ? esc((flag(p.natCode) + ' ' + p.nat).trim()) : '<span class="dim">—</span>'}</td>
      <td><span class="badge pos-${p.pos}">${POS_LABELS[p.pos] || esc(p.pos)}</span></td>
      <td>${esc(COMP_NAME[r.scope] || r.scope)}</td>
      <td class="r num">${fmt(p.age)}</td>
      <td class="r num">${val(r,'n',R)}</td>
      <td class="r num">${fmt(val(r,'mins_played',R))}</td>
      <td class="r num ${heat('score10', s10)}"><span class="score ${scoreClass(s10)}">${fmt(s10)}</span></td>
      ${sc.map(k => { const v = val(r,k,R); return `<td class="r num ${heat(k, v)}">${fmt(v)}</td>`; }).join('')}
    </tr>`;
  }).join('');
  $('players-table').tBodies[0].querySelectorAll('a[data-slug]').forEach(a => a.addEventListener('click', () => openPlayer(a.dataset.slug, a.dataset.scope)));
  $('players-empty').hidden = total > 0;
  $('rows-count').textContent = total ? `${total.toLocaleString('fr-FR')} ligne${total > 1 ? 's' : ''}` : '';

  const pag = $('pagination');
  if (pages <= 1){ pag.innerHTML = ''; return; }
  pag.innerHTML = `<button class="btn" id="pg-prev" ${S.page === 1 ? 'disabled' : ''}>‹ Préc.</button>
    <span class="info num">${start + 1}–${Math.min(start + PAGE_SIZE, total)} sur ${total.toLocaleString('fr-FR')}</span>
    <button class="btn" id="pg-next" ${S.page === pages ? 'disabled' : ''}>Suiv. ›</button>`;
  const go = d => { S.page += d; renderTable(); $('players-table').scrollIntoView({block:'start'}); };
  $('pg-prev').addEventListener('click', () => go(-1));
  $('pg-next').addEventListener('click', () => go(1));
}

  $('method-list').innerHTML = items.map(i => `<li>${i}</li>`).join('');
}

// ── Vue joueur ────────────────────────────────────────────
const peerCache = new Map();
function peers(scope, pos, range, key){
  const id = [scope, pos, range, key, S.minMins, S.minGames].join('|');
  if (!peerCache.has(id)){
    const mi = STAT_IDX.mins_played;
    const arr = (ROWS_BY_SCOPE.get(scope) || []).filter(r => {
      const b = r.b[range];
      return b && r.p.pos === pos && b[0] >= S.minGames && (b[2 + mi] || 0) >= S.minMins;
    }).map(r => val(r, key, range)).filter(v => v != null).sort((a,b) => a - b);
    peerCache.set(id, arr);
  }
  return peerCache.get(id);
}

function setupPlayerView(){
  const input = $('player-search');
  input.addEventListener('input', () => {
    const q = norm(input.value.trim());
    const box = $('search-results');
    if (q.length < 2){ box.innerHTML = ''; return; }
    const hits = PLAYERS.filter(p => p.search.includes(q)).slice(0, 20);
    box.innerHTML = hits.length ? hits.map(p => `<button class="result" data-slug="${esc(p.slug)}">
      <span class="badge pos-${p.pos}">${POS_LABELS[p.pos]}</span><span class="rn">${esc(p.name)}</span>
      <span class="rm">${esc(p.club)}${p.nat ? ' · ' + esc((flag(p.natCode) + ' ' + p.nat).trim()) : ''}</span></button>`).join('')
      : '<div class="empty">Aucun joueur trouvé</div>';
    box.querySelectorAll('.result').forEach(b => b.addEventListener('click', () => { box.innerHTML = ''; input.value = ''; openPlayer(b.dataset.slug); }));
  });
  $('cmp-range').addEventListener('click', e => { const v = +e.target.dataset.v; if (v){ S.cmpRange = v; renderCompare(); } });
  $('cmp-scope').addEventListener('change', e => { S.cmpScope = e.target.value; renderCompare(); });
  $('cmp-clear').addEventListener('click', () => { S.cmp = []; renderCompare(); writeHash(); });
}

const playerBySlug = slug => PLAYERS.find(p => p.slug === slug);
const rangeButtons = active => RANGES.map(n => `<button data-v="${n}" class="${n === active ? 'active' : ''}">L${n}</button>`).join('');

function openPlayer(slug, scope = ALL){
  S.player = slug; S.pScope = scope; S.pRange = S.range;
  switchTab('player');
  renderPlayerCard();
  window.scrollTo({top:0});
}

function renderPlayerCard(){
  const box = $('player-card');
  const p = S.player && playerBySlug(S.player);
  if (!p){ box.innerHTML = S.cmp.length ? '' : '<div class="empty">Recherchez un joueur, ou cliquez sur un nom dans la vue groupe.</div>'; return; }
  const scopesOf = p.rows.map(r => r.scope).sort((a,b) => a === ALL ? -1 : b === ALL ? 1 : a === INTL ? 1 : b === INTL ? -1 : 0);
  if (!scopesOf.includes(S.pScope)) S.pScope = scopesOf[0];
  const row = p.rows.find(r => r.scope === S.pScope);
  const R = S.pRange;
  const b = row && row.b[R];
  const inCmp = S.cmp.includes(p.slug);
  let html = `<section class="card pcard">
    <div class="pcard-head"><div>
      <h2>${esc(p.name)}</h2>
      <div class="pmeta"><span class="badge pos-${p.pos}">${POS_LABELS[p.pos]}</span>${esc(p.club)}${p.age ? ` · ${p.age} ans` : ''}${p.nat ? ` · ${esc((flag(p.natCode) + ' ' + p.nat).trim())}` : ''}</div>
    </div>
    <button class="btn ${inCmp ? '' : 'primary'}" id="cmp-toggle" ${!inCmp && S.cmp.length >= 4 ? 'disabled' : ''}>${inCmp ? 'Retirer de la comparaison' : '+ Comparer'}</button></div>
    <div class="pcontrols">
      <select class="sel" id="p-scope">${scopesOf.map(s => `<option value="${esc(s)}" ${s === S.pScope ? 'selected' : ''}>${esc(COMP_NAME[s] || s)}</option>`).join('')}</select>
      <div class="seg" id="p-range">${rangeButtons(R)}</div>
    </div>`;
  if (!b){
    html += '<div class="empty">Pas de match joué dans ce périmètre.</div>';
  } else {
    html += `<div class="kpis">
      <div class="kpi"><div class="k">Matchs joués</div><div class="v num">${b[0]}</div></div>
      <div class="kpi"><div class="k">Min. / match</div><div class="v num">${fmt(val(row,'mins_played',R))}</div></div>
      <div class="kpi"><div class="k">Score L${R}</div><div class="v num score ${scoreClass(b[1])}">${fmt(b[1])}</div></div>
    </div><div class="pgroups">`;
    for (const cat of Object.keys(CAT_LABELS)){
      const ss = STATS.filter(s => s.cat === cat && s.key !== 'mins_played' && val(row, s.key, R) != null);
      if (!ss.length) continue;
      html += `<div class="pgroup"><h3>${CAT_LABELS[cat]}</h3>` + ss.map(s => {
        const v = val(row, s.key, R), pr = pctRank(peers(S.pScope, p.pos, R, s.key), v);
        const pc = pr == null ? null : Math.round(pr * 100);
        return `<div class="prow"><span>${esc(s.label)}</span><span class="pv num">${fmt(v)}</span>
          <span class="bar"><i style="width:${pc ?? 0}%"></i></span><span class="pp num">${pc == null ? '' : pc}</span></div>`;
      }).join('') + '</div>';
    }
    html += `</div><p class="note">Barre et nombre à droite : percentile parmi les ${POS_LABELS[p.pos].toLowerCase()}s du même périmètre (${esc(COMP_NAME[S.pScope])}, L${R}, ≥ ${S.minMins} min/match, ≥ ${S.minGames} match${S.minGames>1?'s':''}). Valeurs par 90 min sauf minutes et stats par match.</p>`;
  }
  box.innerHTML = html + '</section>';
  $('p-scope').addEventListener('change', e => { S.pScope = e.target.value; renderPlayerCard(); });
  $('p-range').addEventListener('click', e => { const v = +e.target.dataset.v; if (v){ S.pRange = v; renderPlayerCard(); } });
  $('cmp-toggle').addEventListener('click', () => {
    S.cmp = inCmp ? S.cmp.filter(s => s !== p.slug) : [...S.cmp, p.slug];
    renderPlayerCard(); renderCompare(); writeHash();
  });
}

function renderCompare(){
  const card = $('compare-card');
  const ps = S.cmp.map(playerBySlug).filter(Boolean);
  card.hidden = !ps.length;
  if (!ps.length) return;
  const allScopes = [...new Set(ps.flatMap(p => p.rows.map(r => r.scope)))];
  if (!allScopes.includes(S.cmpScope)) S.cmpScope = ALL;
  $('cmp-scope').innerHTML = allScopes.map(s => `<option value="${esc(s)}" ${s === S.cmpScope ? 'selected' : ''}>${esc(COMP_NAME[s] || s)}</option>`).join('');
  document.querySelectorAll('#cmp-range button').forEach(b => b.classList.toggle('active', +b.dataset.v === S.cmpRange));
  const R = S.cmpRange;
  const rows = ps.map(p => p.rows.find(r => r.scope === S.cmpScope) || null);
  const v = (i, key) => rows[i] ? val(rows[i], key, R) : null;
  const lines = [{key:'n', label:'Matchs joués'}, {key:'score', label:`Score L${R}`},
    ...STATS.map(s => ({key:s.key, label:s.label, cat:s.cat}))];
  let html = '<thead><tr><th>Stat</th>' + ps.map(p => `<th class="r">${esc(p.name)}<br><span class="dim">${esc(p.club)}</span></th>`).join('') + '</tr></thead><tbody>';
  let cat;
  for (const l of lines){
    const vals = ps.map((_, i) => v(i, l.key));
    if (vals.every(x => x == null)) continue;
    if (l.cat && l.cat !== cat){ cat = l.cat; html += `<tr><td class="cat" colspan="${ps.length + 1}">${CAT_LABELS[cat]}</td></tr>`; }
    const best = ps.length > 1 ? Math.max(...vals.filter(x => x != null)) : null;
    html += `<tr><td class="lbl">${esc(l.label)}</td>` + vals.map(x => `<td class="r num ${x != null && x === best ? 'best' : ''}">${fmt(x)}</td>`).join('') + '</tr>';
  }
  $('cmp-table').innerHTML = html + '</tbody>';
}

// ── Onglets & démarrage ───────────────────────────────────
function switchTab(tab){
  S.tab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + tab));
  if (tab === 'player'){ renderPlayerCard(); renderCompare(); }
  writeHash();
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

fetch('data.json', {cache:'no-cache'})
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(raw => {
    prepare(raw);
    readHash();
    [...S.comp].forEach(c => { if (!COMP_NAME[c]) S.comp.delete(c); });
    $('meta-line').textContent = `Mis à jour : ${raw.last_updated} · ${PLAYERS.length.toLocaleString('fr-FR')} joueurs`;
    setupFilters(); setupExports(); setupPlayerView(); renderMethod();
    update();
    switchTab(S.tab);
  })
  .catch(err => {
    $('meta-line').textContent = 'Erreur de chargement des données (' + err.message + ')';
    $('summary').textContent = 'Impossible de charger data.json.';
  });
</script>
